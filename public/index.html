<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل پرونده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .add-button-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .add-btn {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .add-btn:hover {
            background-color: #45a049;
        }

        .article-bar {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .bar-number {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .delete-btn:hover {
            background-color: #da190b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .checkbox-group, .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .checkbox-group label, .radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group input, .radio-group input {
            margin-right: 5px;
            cursor: pointer;
        }

        .status-label {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .status-green {
            background-color: #4CAF50;
            color: white;
        }

        .status-yellow {
            background-color: #FFC107;
            color: black;
        }

        .status-red {
            background-color: #f44336;
            color: white;
        }

        .status-default {
            background-color: transparent;
            color: #555;
        }

        .radio-group.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>پنل مدیریت مقالات</h1>
    
    <div class="add-button-container">
        <button class="add-btn" onclick="addArticleBar()">اضافه کردن</button>
    </div>

    <div id="articles-container" style="margin-top: 20px;"></div>

    <script>
        let articleCount = 0;
        let articles = {};

        // Load saved data on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadArticles();
        });

        function saveToStorage() {
            const data = {
                articleCount: articleCount,
                articles: articles
            };
            try {
                localStorage.setItem('articleManagementData', JSON.stringify(data));
            } catch (e) {
                console.error('Error saving to localStorage:', e);
            }
        }

        function loadArticles() {
            try {
                const savedData = localStorage.getItem('articleManagementData');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    articles = data.articles || {};
                    
                    // If there are no articles, reset counter to 0
                    if (Object.keys(articles).length === 0) {
                        articleCount = 0;
                    } else {
                        // Set articleCount to the highest ID in articles
                        const ids = Object.keys(articles).map(id => parseInt(id));
                        articleCount = Math.max(...ids);
                    }
                    
                    // Recreate all saved articles
                    Object.keys(articles).forEach(id => {
                        const articleData = articles[id];
                        createArticleBar(id, articleData);
                    });
                }
            } catch (e) {
                console.error('Error loading from localStorage:', e);
            }
        }

        function addArticleBar() {
            articleCount++;
            const id = articleCount;
            articles[id] = {
                title: '',
                description: '',
                author: '',
                typeEssay: false,
                typeTranslation: false,
                primitiveStatus: '',
                finalStatus: ''
            };
            createArticleBar(id, articles[id]);
            saveToStorage();
        }

        function createArticleBar(id, data) {
            const container = document.getElementById('articles-container');
            
            const bar = document.createElement('div');
            bar.className = 'article-bar';
            bar.id = 'article-' + id;
            
            bar.innerHTML = `
                <div class="bar-header">
                    <div class="bar-number">مقاله #${id}</div>
                    <button class="delete-btn" onclick="deleteArticleBar('article-${id}', ${id})">حذف</button>
                </div>

                <div class="form-group">
                    <label for="title-${id}">عنوان:</label>
                    <input type="text" id="title-${id}" placeholder="عنوان را وارد کنید" value="${data.title}" oninput="saveArticleData(${id})">
                </div>

                <div class="form-group">
                    <label for="description-${id}">توضیحات:</label>
                    <input type="text" id="description-${id}" placeholder="توضیحات را بنویسید (اختیاری)" value="${data.description}" oninput="saveArticleData(${id})">
                </div>

                <div class="form-group">
                    <label for="author-${id}">نام نویسنده:</label>
                    <input type="text" id="author-${id}" placeholder="نام نویسنده را وارد کنید" value="${data.author}" oninput="saveArticleData(${id})">
                </div>

                <div class="form-group">
                    <label>نوع مقاله:</label>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="type-${id}" value="essay" ${data.typeEssay ? 'checked' : ''} onchange="saveArticleData(${id})"> تالیف
                        </label>
                        <label>
                            <input type="checkbox" name="type-${id}" value="translation" ${data.typeTranslation ? 'checked' : ''} onchange="saveArticleData(${id})"> ترجمه
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label><span class="status-label status-default" id="primitive-label-${id}">وضعیت اولیه:</span></label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="primitive-${id}" value="will-write" ${data.primitiveStatus === 'will-write' ? 'checked' : ''} onchange="updatePrimitiveStatus(${id})"> می‌نویسد
                        </label>
                        <label>
                            <input type="radio" name="primitive-${id}" value="uncertain" ${data.primitiveStatus === 'uncertain' ? 'checked' : ''} onchange="updatePrimitiveStatus(${id})"> نامعلوم
                        </label>
                        <label>
                            <input type="radio" name="primitive-${id}" value="will-not" ${data.primitiveStatus === 'will-not' ? 'checked' : ''} onchange="updatePrimitiveStatus(${id})"> نمی‌نویسد (حذف)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label><span class="status-label status-default" id="final-label-${id}">وضعیت نهایی:</span></label>
                    <div class="radio-group disabled" id="final-group-${id}">
                        <label>
                            <input type="radio" name="final-${id}" value="received" ${data.finalStatus === 'received' ? 'checked' : ''} onchange="updateFinalStatus(${id})"> دریافت/درحال بررسی
                        </label>
                        <label>
                            <input type="radio" name="final-${id}" value="not-received" ${data.finalStatus === 'not-received' ? 'checked' : ''} onchange="updateFinalStatus(${id})"> عدم دریافت
                        </label>
                        <label>
                            <input type="radio" name="final-${id}" value="ready" ${data.finalStatus === 'ready' ? 'checked' : ''} onchange="updateFinalStatus(${id})"> آماده انتشار
                        </label>
                    </div>
                </div>
            `;
            
            container.appendChild(bar);
            
            // Apply saved status colors
            if (data.primitiveStatus) {
                updatePrimitiveStatus(id);
            }
            if (data.finalStatus) {
                updateFinalStatus(id);
            }
        }

        function saveArticleData(id) {
            if (!articles[id]) return;
            
            const titleInput = document.getElementById('title-' + id);
            const descInput = document.getElementById('description-' + id);
            const authorInput = document.getElementById('author-' + id);
            const typeCheckboxes = document.getElementsByName('type-' + id);
            
            articles[id].title = titleInput ? titleInput.value : '';
            articles[id].description = descInput ? descInput.value : '';
            articles[id].author = authorInput ? authorInput.value : '';
            articles[id].typeEssay = typeCheckboxes[0] ? typeCheckboxes[0].checked : false;
            articles[id].typeTranslation = typeCheckboxes[1] ? typeCheckboxes[1].checked : false;
            
            saveToStorage();
        }

        function deleteArticleBar(barId, id) {
            const bar = document.getElementById(barId);
            if (bar) {
                bar.remove();
            }
            delete articles[id];
            
            // If all articles are deleted, reset the counter
            if (Object.keys(articles).length === 0) {
                articleCount = 0;
            }
            
            saveToStorage();
            renumberBars();
        }

        function renumberBars() {
            const bars = document.querySelectorAll('.article-bar');
            bars.forEach((bar, index) => {
                const numberElement = bar.querySelector('.bar-number');
                if (numberElement) {
                    numberElement.textContent = `مقاله #${index + 1}`;
                }
            });
        }

        function updatePrimitiveStatus(id) {
            const radios = document.getElementsByName('primitive-' + id);
            const label = document.getElementById('primitive-label-' + id);
            const finalGroup = document.getElementById('final-group-' + id);
            const finalRadios = document.getElementsByName('final-' + id);
            
            let selectedValue = null;
            for (let radio of radios) {
                if (radio.checked) {
                    selectedValue = radio.value;
                    break;
                }
            }

            if (articles[id]) {
                articles[id].primitiveStatus = selectedValue || '';
                saveToStorage();
            }

            label.className = 'status-label';
            
            if (selectedValue === 'will-write') {
                label.classList.add('status-green');
                finalGroup.classList.remove('disabled');
            } else if (selectedValue === 'uncertain') {
                label.classList.add('status-yellow');
                finalGroup.classList.add('disabled');
                for (let radio of finalRadios) {
                    radio.checked = false;
                }
                if (articles[id]) {
                    articles[id].finalStatus = '';
                }
                updateFinalStatus(id);
            } else if (selectedValue === 'will-not') {
                label.classList.add('status-red');
                finalGroup.classList.add('disabled');
                for (let radio of finalRadios) {
                    radio.checked = false;
                }
                if (articles[id]) {
                    articles[id].finalStatus = '';
                }
                updateFinalStatus(id);
            } else {
                label.classList.add('status-default');
                finalGroup.classList.add('disabled');
            }
        }

        function updateFinalStatus(id) {
            const radios = document.getElementsByName('final-' + id);
            const label = document.getElementById('final-label-' + id);
            
            let selectedValue = null;
            for (let radio of radios) {
                if (radio.checked) {
                    selectedValue = radio.value;
                    break;
                }
            }

            if (articles[id]) {
                articles[id].finalStatus = selectedValue || '';
                saveToStorage();
            }

            label.className = 'status-label';
            
            if (selectedValue === 'received') {
                label.classList.add('status-yellow');
            } else if (selectedValue === 'not-received') {
                label.classList.add('status-red');
            } else if (selectedValue === 'ready') {
                label.classList.add('status-green');
            } else {
                label.classList.add('status-default');
            }
        }
    </script>
</body>
</html>
